<div style="max-width: 400px; margin: 20px auto; font-family: Arial, sans-serif;">
  <h2>Button Style Mockup</h2>

  <!-- Isotope Button -->
  <button style="background: hsl(121, 39%, 48%); color: white; border: none; border-radius: 6px; padding: 12px 0; width: 100%; font-size: 1rem; cursor: pointer; margin-bottom: 12px; transition: background 0.2s;" onmouseover="this.style.background='#22313a'" onmouseout="this.style.background='hsl(121, 39%, 48%)'">Isotope Button</button>

  <!-- Selection Buttons -->
  <h3>Selection Buttons</h3>

  <!-- Muted Slate -->
  <button style="background: #4a5a63; color: white; border: none; border-radius: 6px; padding: 12px 0; width: 100%; font-size: 1rem; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 8px; transition: background 0.2s, box-shadow 0.2s;" onmouseover="this.style.background='#22313a'; this.style.color='#ffd700'" onmouseout="this.style.background='#4a5a63'; this.style.color='white'">Muted Slate</button>

  <!-- Ghost -->
  <button style="background: transparent; border: 2px solid #35424a; color: #35424a; border-radius: 6px; padding: 10px 0; width: 100%; font-size: 1rem; cursor: pointer; margin-bottom: 8px; transition: all 0.2s;" onmouseover="this.style.background='#22313a'; this.style.color='#ffd700'; this.style.borderColor='#22313a'" onmouseout="this.style.background='transparent'; this.style.color='#35424a'; this.style.borderColor='#35424a'">Ghost</button>

  <!-- Soft Neutral -->
  <button style="background: #e5e5e5; color: #22313a; border: 1px solid #ccc; border-radius: 6px; padding: 12px 0; width: 100%; font-size: 1rem; cursor: pointer; transition: background 0.2s, color 0.2s;" onmouseover="this.style.background='#22313a'; this.style.color='#ffd700'" onmouseout="this.style.background='#e5e5e5'; this.style.color='#22313a'">Soft Neutral</button>

  <!-- Calculate Buttons -->
  <h3 style="margin-top: 24px;">Calculate Buttons</h3>

  <!-- Gold CTA -->
  <button style="background: #ffd700; color: #22313a; border: none; border-radius: 6px; padding: 12px 0; width: 100%; font-size: 1rem; cursor: pointer; margin-bottom: 8px;">Gold CTA</button>

  <!-- Deep Navy CTA -->
  <button style="background: #22313a; color: white; border: none; border-radius: 6px; padding: 12px 0; width: 100%; font-size: 1rem; cursor: pointer;">Deep Navy CTA</button>
</div>
